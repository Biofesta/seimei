<style>

body[data-product="BUSINESS"] .business-guide{

body[data-product="BUSINESS"] .business-example-grid{

body[data-product="BUSINESS"] .business-example{

body[data-product="BUSINESS"] .business-actions{

body[data-product="BUSINESS"] .rating-mark{

  grid-column:1 / -1;
  text-align:center;
  margin:0;
  padding:6px 10px;

  font-weight:700;
  line-height:1.4;
  color:#625852;

<body data-product="BUSINESS">

<header class="business-hero">
  <div class="wrap">
    <img class="business-header-image" src="./assets/business-header.png" alt="商品名・企業名　成功への第一歩">
    <div class="naming-use-counter" aria-live="polite">累計名称診断数 <strong id="businessNamingCounterValue">---</strong> 件</div>
  </div>
</header>

<main class="wrap">
  <section class="panel business-input-panel business-input-stage">
    <img class="business-dragon business-dragon-left" src="./assets/business-dragon-left.png" alt="" aria-hidden="true">
    <img class="business-dragon business-dragon-right" src="./assets/business-dragon-right.png" alt="" aria-hidden="true">
    <h2>1. 診断する名称</h2>

    <div class="business-grid">
      <div>
        <label>▽商品・企業等の名称を入力してください。英語等の場合、そのカタカナ表記で日本語的発音から捉えたイメージとして捉えてください。</label>
        <input id="businessName" type="text" autocomplete="off" placeholder="例：未来">
      </div>

      <div>
        <label>文字数（自動）</label>
        <input id="nameLength" type="text" value="0" readonly aria-readonly="true">
      </div>
    </div>

    <div class="business-guide">
      <strong>診断する名称部分について</strong>
      <div class="business-example-grid">
        <div class="business-example">
          <b>企業名</b>
          〇〇〇株式会社 → 〇〇〇<br>
          株式会社〇〇〇 → 〇〇〇<br>
          〇〇〇証券・〇〇〇銀行・〇〇〇病院 → 業務を表す一般名称を除いた「〇〇〇」部分を診断します。
        </div>
        <div class="business-example">
          <b>商品名</b>
          〇〇〇〇D → 〇〇〇〇<br>
          〇〇〇〇GTR → 〇〇〇〇<br>
          英字・数字・記号が型式や分類を表す場合は、それらを除いた基本名称部分を診断します。
        </div>
      </div>
    </div>

    <div class="business-actions">
      <button id="diagnoseBtn" class="btn" type="button" disabled>この名称を診断</button>
    </div>

    <div id="inputMessage" class="notice warn hidden business-error"></div>

    <img class="business-input-footer" src="./assets/business-input-footer.png" alt="いい名前が、ビジネスの未来をつくる。">
  </section>

  <section id="resultPanel" class="panel hidden">
    <h2>2. 診断結果</h2>
    <div class="business-result">
      <div id="resultName" class="result-name"></div>
      <div id="charBreakdown" class="result-pills"></div>

      <div class="total-result">
        <div class="total-card">
          <div class="cap">画数</div>
          <div id="totalNumber" class="total-number"></div>
        </div>

        <div class="total-card">
          <div class="cap">評価記号</div>
          <div id="ratingMark" class="rating-mark"></div>
        </div>

        <div class="total-card">
          <div class="cap">特徴</div>
          <div id="featureKeywords" class="feature-keywords" hidden></div>
          <div id="featureText" class="feature-text"></div>
        </div>
      </div>
    </div>
  </section>
</main>

function updateBusinessDiagnosisKeywords(){
  const numberEl=document.getElementById("totalNumber");
  const keywordEl=document.getElementById("featureKeywords");
  if(!numberEl || !keywordEl) return;
  const m=String(numberEl.textContent||"").match(/\d+/);
  const key=m ? Number(m[0]) : 0;
  const text=BUSINESS_DIAGNOSIS_KEYWORDS[key] || "";
  keywordEl.textContent=text;
  keywordEl.hidden=!text;
}

const businessTotalNumberEl=document.getElementById("totalNumber");
if(businessTotalNumberEl){
  new MutationObserver(updateBusinessDiagnosisKeywords).observe(
    businessTotalNumberEl,
    {childList:true,subtree:true,characterData:true}
  );
  updateBusinessDiagnosisKeywords();
}

<script>
(function(){
const COUNTER_KEY='biofesta-business-name-diagnosis-v1';
const COUNTER_ID='businessNamingCounterValue';
const COUNTER_BASE='https://countapi.mileshilliard.com/api/v1';
function showCount(value){
  const el=document.getElementById(COUNTER_ID);
  if(!el) return;
  const n=Number(value);
  el.textContent=Number.isFinite(n)?n.toLocaleString('ja-JP'):'---';
}
async function loadCount(){
  try{
    const r=await fetch(`${COUNTER_BASE}/get/${encodeURIComponent(COUNTER_KEY)}`,{cache:'no-store'});
    if(!r.ok){ if(r.status===404){showCount(0);return;} throw new Error(String(r.status)); }
    const data=await r.json(); showCount(data.value);
  }catch(e){ showCount('---'); }
}
async function hitCount(){
  try{
    const r=await fetch(`${COUNTER_BASE}/hit/${encodeURIComponent(COUNTER_KEY)}`,{cache:'no-store'});
    if(!r.ok) return;
    const data=await r.json(); showCount(data.value);
  }catch(e){}
}
loadCount();
const btn=document.getElementById('diagnoseBtn');
const total=document.getElementById('totalNumber');
const panel=document.getElementById('resultPanel');
if(btn && total && panel){
  let pending=false;
  btn.addEventListener('click',()=>{pending=true;});
  function fireIfReady(){
    if(pending && !panel.classList.contains('hidden') && total.textContent.trim()){
      pending=false; hitCount();
    }
  }
  new MutationObserver(fireIfReady).observe(total,{childList:true,subtree:true,characterData:true});
  new MutationObserver(fireIfReady).observe(panel,{attributes:true,attributeFilter:['class']});
}
})();
</script>
